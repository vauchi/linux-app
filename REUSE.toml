version = 1
SPDX-PackageName = "vauchi-linux-app"
SPDX-PackageSupplier = "Mattia Egloff <mattia.egloff@pm.me>"

[[annotations]]
path = ["LICENSES/**"]
SPDX-FileCopyrightText = "Free Software Foundation"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["**/Cargo.lock", ".gitignore", "supply-chain/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Brand fonts, copied from linux-gtk for the packages (owner, 2026-11-03).
[[annotations]]
path = ["data/fonts/BricolageGrotesque*.ttf"]
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors (https://github.com/ateliertriay/bricolage)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["data/fonts/HankenGrotesk*.ttf"]
SPDX-FileCopyrightText = "2021 The Hanken Grotesk Project Authors (https://github.com/marcologous/hanken-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["data/fonts/JetBrainsMono*.ttf"]
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Debian formats that allow no comment line: dpkg rejects an SPDX header in
# source/format and warns on one in the changelog.
[[annotations]]
path = ["debian/changelog", "debian/source/format"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"
