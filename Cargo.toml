[package]
name = "vauchi-linux-app"
version = "0.10.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/linux-app"
description = "The Linux app: Core, the linux-hw hardware shell and the GTK display shell (ADR-078)"
publish = false

[features]
default = ["gtk"]
gtk = ["dep:gtk4", "dep:libadwaita", "dep:gtk-display"]
qt = ["dep:qt-display"]
cli = ["dep:cli-display", "dep:rustix", "dep:clap_builder", "dep:signal-hook"]
tui = ["dep:tui-display", "dep:crossterm", "dep:ratatui-core", "dep:ratatui-crossterm", "dep:signal-hook"]
# NFC over PC/SC needs libpcsclite on the build host; off by default.
nfc = ["vauchi-linux-hw/nfc"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gvauchi"
path = "src/bin/gvauchi.rs"
required-features = ["gtk"]

[[bin]]
name = "vauchi-tui"
path = "src/bin/vauchi-tui.rs"
required-features = ["tui"]

[[bin]]
name = "qvauchi"
path = "src/bin/qvauchi.rs"
required-features = ["qt"]

[[bin]]
name = "vauchi"
path = "src/bin/vauchi.rs"
required-features = ["cli"]

[dependencies]
# Core, the hardware shell and the display shell all on contract v0.97.2
# (ADR-078 decision 6); deny.toml refuses a second copy of any of them (D-5).
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.103.0", version = "=0.103.0", features = ["secure-storage-linux"] }
vauchi-app = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.103.0", version = "=0.103.0" }
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.97.2", version = "=0.97.2" }
# gio's NetworkMonitor for the network-cost report; the same gtk4 the
# display shell links (deny.toml refuses a second copy).
gtk4 = { version = "0.9", optional = true }
# The catalog renderer's window chrome; the version gtk-display links.
libadwaita = { version = "0.7", features = ["v1_4"], optional = true }
vauchi-linux-hw = { git = "https://gitlab.com/vauchi/linux-hw.git", tag = "v0.100.1", version = "=0.100.1", features = ["audio", "camera", "mdns"] }
# The GTK display shell, repository `gtk-display` since 2026-11-11; its
# crate is still `vauchi-gtk` (ADR-078 step 4).
gtk-display = { package = "vauchi-gtk", git = "https://gitlab.com/vauchi/gtk-display.git", tag = "v0.10.0", version = "=0.10.0", optional = true }
qt-display = { git = "https://gitlab.com/vauchi/qt-display.git", tag = "qt-display-v0.1.3", version = "=0.1.3", optional = true }
serde_json = "1"
cli-display = { package = "vauchi-cli-display", git = "https://gitlab.com/vauchi/cli.git", tag = "v0.1.3", version = "=0.2.0", optional = true }
rustix = { version = "1.1", features = ["event", "termios"], optional = true }
clap_builder = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"], optional = true }
signal-hook = { version = "0.3", default-features = false, optional = true }
tui-display = { package = "vauchi-tui-display", git = "https://gitlab.com/vauchi/tui.git", tag = "v0.3.0", version = "=0.2.0", optional = true }
crossterm = { version = "0.28", optional = true }
ratatui-core = { version = "0.1.2", default-features = false, features = ["std", "layout-cache", "underline-color"], optional = true }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["crossterm_0_28", "underline-color"], optional = true }

# Renders Core's screen catalog to PNGs for test:screen-catalog. A test
# tool, not app wiring, so it lives outside src/ and lint:no-behaviour.
[[bin]]
name = "render_catalog"
path = "tools/render_catalog.rs"
required-features = ["gtk"]

[[test]]
name = "smoke_test"
required-features = ["gtk"]

[[test]]
name = "hardware_routing_test"
required-features = ["gtk"]

[[test]]
name = "wiring_tests"
required-features = ["gtk"]

[[test]]
name = "render_catalog_test"
required-features = ["gtk"]

[[test]]
name = "terminal_display_contract_test"
required-features = ["cli", "tui"]

[[test]]
name = "qt_bridge_test"
required-features = ["qt"]

[[test]]
name = "qt_roundtrip"
required-features = ["qt"]
harness = false

[[test]]
name = "qt_core_interaction"
required-features = ["qt"]
harness = false

[dev-dependencies]
# The storage tests' throwaway data directories.
tempfile = "3.0"
# The render_catalog tests write catalog JSON for the tool to read.

# rqrr 0.11.0 with the clamped Perspective::map (vauchi/utils/rqrr). A
# [patch] applies only in the workspace that declares it, so this binary
# needs its own; tests/rqrr_resolves_from_the_fork.rs guards it.
[patch.crates-io]
rqrr = { git = "https://gitlab.com/vauchi/utils/rqrr.git", tag = "v0.11.0+vauchi.1" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
