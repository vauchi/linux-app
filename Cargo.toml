[package]
name = "vauchi-linux-app"
version = "0.8.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/linux-app"
description = "The Linux app: Core, the linux-hw hardware shell and the GTK display shell (ADR-078)"
publish = false

[features]
# NFC over PC/SC needs libpcsclite on the build host; off by default, as in
# the GTK shell's own gvauchi.
nfc = ["vauchi-linux-hw/nfc", "gtk-display/nfc"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "gvauchi"
path = "src/bin/gvauchi.rs"

[dependencies]
# Core, the hardware shell and the display shell all on contract v0.96.2
# (ADR-078 decision 6); deny.toml refuses a second copy of any of them (D-5).
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.98.0", version = "=0.98.0", features = ["secure-storage-linux"] }
vauchi-app = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.98.0", version = "=0.98.0" }
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.96.2", version = "^0.96" }
# gio's NetworkMonitor for the network-cost report; the same gtk4 the
# display shell links (deny.toml refuses a second copy).
gtk4 = "0.9"
# The catalog renderer's window chrome; the version gtk-display links.
libadwaita = { version = "0.7", features = ["v1_4"] }
vauchi-linux-hw = { git = "https://gitlab.com/vauchi/linux-hw.git", tag = "v0.97.1", version = "=0.97.1", features = ["audio", "camera"] }
# The GTK display shell; its repository is still `linux-gtk` and its crate
# `vauchi-gtk` until the rename (ADR-078 step 4).
gtk-display = { package = "vauchi-gtk", git = "https://gitlab.com/vauchi/linux-gtk.git", tag = "v0.7.3", version = "=0.7.3" }

# Renders Core's screen catalog to PNGs for test:screen-catalog. A test
# tool, not app wiring, so it lives outside src/ and lint:no-behaviour.
[[bin]]
name = "render_catalog"
path = "tools/render_catalog.rs"

[dev-dependencies]
# The storage tests' throwaway data directories.
tempfile = "3.0"

# rqrr 0.11.0 with the clamped Perspective::map (vauchi/utils/rqrr). A
# [patch] applies only in the workspace that declares it, so this binary
# needs its own; tests/rqrr_resolves_from_the_fork.rs guards it.
[patch.crates-io]
rqrr = { git = "https://gitlab.com/vauchi/utils/rqrr.git", tag = "v0.11.0+vauchi.1" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
