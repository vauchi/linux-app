# SPDX-License-Identifier: GPL-3.0-or-later

# GitLab CI for linux-app: the Linux app (ADR-078) — Core, linux-hw and a
# display shell per binary. Shared templates from vauchi/scripts.

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.25
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/allow-git.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/content-fetch.yml'
      - '/ci-templates/vrt-upload.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.25"
  # cargo audit runs with --deny warnings; every entry here is an
  # advisory with no fix available to us, not one we chose to skip.
  #   RUSTSEC-2026-0543  chrono and chrono-tz unmaintained, only via
  #   RUSTSEC-2026-0555  rxing (QR decode); mirrors deny.toml (private#1274).
  AUDIT_IGNORES: "--ignore RUSTSEC-2026-0543 --ignore RUSTSEC-2026-0555"

stages:
  - auto-tag
  - lint
  - build
  - test
  - security
  - package
  - publish

# A version bump merged to main is the release: the job pushes
# v<Cargo.toml version> when that tag does not exist yet, so the tag always
# sits on the merged commit (private#1045).
auto-tag:version:
  extends: .auto-tag
  needs: [check:release-versions]

check:release-versions:
  stage: .pre
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  script:
    - sh ci/tests/release-versions.test.sh
    - sh ci/check-release-versions.sh

lint:format:
  extends: [.linux-runner, .lint-format, .validation-rust, .timeout-quick]

.camera-sdk:
  before_script:
    - |
      if ! pkg-config --atleast-version=0.3.77 libpipewire-0.3; then
        curl --fail-with-body --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fci%2Fprepare-pipewire-sdk.sh/raw?ref=c8decece5226d8981ce3cfb61ec33c4be0d0366b" \
          -o .prepare-pipewire-sdk.sh
        bash .prepare-pipewire-sdk.sh "${CI_PROJECT_DIR}/.camera-sdk"
        . "${CI_PROJECT_DIR}/.camera-sdk/env.sh"
      fi
      pkg-config --atleast-version=0.3.77 libpipewire-0.3

lint:clippy:
  extends: [.linux-runner, .lint-clippy, .validation-rust, .timeout-cold-rebuild]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]

# ADR-078 D-13: the app holds no behaviour. A match on a Command or an
# Event anywhere but the wiring module is display or hardware work that
# belongs in a shell.
lint:no-behaviour:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  script:
    - |
      if grep -rnE '\b(Command|Event)::' src --include='*.rs' | grep -v '^src/wiring\.rs:'; then
        echo "lint:no-behaviour: Command/Event outside src/wiring.rs (ADR-078 D-13)"
        exit 1
      fi
      echo "lint:no-behaviour: only src/wiring.rs touches Command or Event"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:gvauchi:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: build
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - cargo build --release --bins
  artifacts:
    paths:
      - target/release/gvauchi
      - target/release/seed-identity
      - target/release/render_catalog
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # A release tag builds too: the package jobs pack this job's gvauchi
    # (linux-gtk v0.6.1 shipped no package for want of it).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# AT-SPI tests that drive gvauchi with a real engine under Xvfb (ADR-078
# step 4d.4): copied from linux-gtk's test:a11y, which goes in 4d.6 (copy
# first, delete last). The renderer-only tests (render_fixture) stay in
# linux-gtk. run-tests.sh takes a free display (xvfb-run -a); the resource
# group keeps this repo's Xvfb jobs off the shared runner one at a time.
test:a11y:
  before_script:
    - !reference [.camera-sdk, before_script]
  stage: test
  needs:
    - job: build:gvauchi
  tags: [linux, self-hosted]
  resource_group: gtk-xvfb
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
  script:
    - chmod +x tests/atspi/run-tests.sh
    - tests/atspi/run-tests.sh -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:qvauchi:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: build
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - cargo build --locked --release --no-default-features --features qt,camera-pipewire --bin qvauchi
  artifacts:
    paths:
      - target/release/qvauchi
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The same AT-SPI checks for qvauchi, copied from qt-display's tests/atspi
# before the legacy Qt app goes (private#1029, copy first, delete last).
# The renderer probe stays in qt-display: it runs on the library alone.
test:a11y-qt:
  before_script:
    - !reference [.camera-sdk, before_script]
  stage: test
  needs:
    - job: build:qvauchi
  tags: [linux, self-hosted]
  resource_group: gtk-xvfb
  script:
    - chmod +x tests/atspi-qt/run-tests.sh
    - tests/atspi-qt/run-tests.sh --tb=short -k "not test_snapshots"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Visual snapshots of qvauchi's destinations and onboarding, copied from
# qt-display's tests/atspi before the legacy Qt app goes (private#1029,
# copy first, delete last). Platform "linux-app-qt" keeps its own
# baselines while qt-display still uploads "linux-qt". Advisory until
# references are reviewed: Contacts and My Card draw a per-run identity.
test:snapshots-qt:
  before_script:
    - !reference [.camera-sdk, before_script]
  allow_failure: true
  stage: test
  needs:
    - job: build:qvauchi
  tags: [linux, self-hosted]
  resource_group: gtk-xvfb
  variables:
    VRT_PLATFORM: linux-app-qt
    VRT_SCREENSHOT_DIR: tests/atspi-qt/snapshots/actual
  script:
    - chmod +x tests/atspi-qt/run-tests.sh
    - mkdir -p tests/atspi-qt/snapshots/{baseline,actual,diff}
    - tests/atspi-qt/run-tests.sh --tb=short -k "test_snapshots"
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - tests/atspi-qt/snapshots/baseline/
      - tests/atspi-qt/snapshots/actual/
      - tests/atspi-qt/snapshots/diff/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Visual snapshots of gvauchi's destinations and onboarding, uploaded to
# the Visual Regression Tracker as platform "linux-app" (owner,
# 2026-11-03: its own baselines while linux-gtk still uploads "linux-gtk";
# ADR-078 step 4d.4, copy first).
test:snapshots:
  before_script:
    - !reference [.camera-sdk, before_script]
  allow_failure: true
  stage: test
  needs:
    - job: build:gvauchi
  tags: [linux, self-hosted]
  resource_group: gtk-xvfb
  variables:
    VRT_PLATFORM: linux-app
    VRT_SCREENSHOT_DIR: tests/atspi/snapshots/baseline
  script:
    - chmod +x tests/atspi/run-tests.sh
    - mkdir -p tests/atspi/snapshots/{baseline,actual,diff}
    - tests/atspi/run-tests.sh -v --tb=short -k "test_snapshots"
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - tests/atspi/snapshots/baseline/
      - tests/atspi/snapshots/actual/
      - tests/atspi/snapshots/diff/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Manual snapshot regeneration: Run pipeline with REGENERATE_SNAPSHOTS=1.
test:snapshots:record:
  before_script:
    - !reference [.camera-sdk, before_script]
  stage: test
  needs:
    - job: build:gvauchi
  tags: [linux, self-hosted]
  resource_group: gtk-xvfb
  variables:
    UPDATE_SNAPSHOTS: "1"
  script:
    - chmod +x tests/atspi/run-tests.sh
    - tests/atspi/run-tests.sh -v --tb=short -k "test_snapshots"
  artifacts:
    when: always
    paths:
      - tests/atspi/snapshots/baseline/
    expire_in: 90 days
  rules:
    - if: $REGENERATE_SNAPSHOTS == "1"
      when: manual

# Every screen of Core's contract catalog rendered with linux-app's engine
# and gtk-display's renderer, uploaded as platform "linux-app".
test:screen-catalog:
  stage: test
  needs:
    - job: build:gvauchi
  tags: [linux, self-hosted]
  resource_group: gtk-xvfb
  variables:
    VRT_PLATFORM: linux-app
    VRT_SCREENSHOT_DIR: build/screen-catalog
    CATALOG_OUT_DIR: build/screen-catalog
    # The light variant needs a light theme; Core from a cargo git checkout
    # compiles in only the default dark one, so the renderer reads the
    # catalog `.clone-themes` generates from the sibling repo.
    VAUCHI_THEMES_JSON: ../themes/generated/themes.json
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-themes, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - mkdir -p "$CATALOG_OUT_DIR" build
    - |
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/vauchi%2Fcontract/repository/files/ci%2Ffetch-screen-catalog.py/raw?ref=57defdf7231a592049a8fcab45cd8603e3ab5d40" \
        -o build/fetch-screen-catalog.py
      python3 build/fetch-screen-catalog.py build/screen_catalog_v1.json
    - |
      chmod +x target/release/render_catalog
      # Cairo renderer (no DRI3 under Xvfb), a private display, a fresh
      # session bus — the recipe tests/atspi/run-tests.sh uses.
      env GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 XDG_CURRENT_DESKTOP=none \
        xvfb-run -a -s '-screen 0 980x1480x24' \
        dbus-run-session -- target/release/render_catalog build/screen_catalog_v1.json "$CATALOG_OUT_DIR" 900 1400
      count=$(find "$CATALOG_OUT_DIR" -name '*.png' | wc -l | tr -d ' ')
      echo "rendered $count PNG(s)"
      [ "$count" -gt 0 ]
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - build/screen_catalog_v1.json
      - build/screen_catalog_v1.provenance.json
      - build/screen-catalog/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:unit:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - cargo nextest run --profile ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:shared:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - python3 ci/tests/registry-launch.test.py
    - bash ci/tests/camera-dependencies.test.sh gtk
    - bash ci/tests/camera-dependencies.test.sh qt
    - if bash ci/tests/camera-dependencies.test.sh gtk,camera-pipewire; then echo "FAIL — camera graph guard accepted PipeWire"; exit 1; fi
    - bash ci/tests/headless-dependencies.test.sh
    - bash ci/tests/headless-dependencies.test.sh cli
    - bash ci/tests/headless-dependencies.test.sh tui
    - bash ci/tests/headless-dependencies.test.sh cli,tui
    - if bash ci/tests/headless-dependencies.test.sh gtk; then echo "FAIL — graph guard accepted GTK"; exit 1; fi
    - if bash ci/tests/headless-dependencies.test.sh qt; then echo "FAIL — graph guard accepted Qt"; exit 1; fi
    - cargo test --locked --no-default-features --lib --test shared_engine_test --test hardware_bridge_test --test hardware_bridge_lifecycle_test --test bridge_invalidation_test --test terminal_loop_test --test terminal_shutdown_test
    - cargo check --locked --no-default-features --all-targets
    - cargo test --locked --no-default-features --features cli,tui --all-targets
    - cargo clippy --locked --no-default-features --features cli,tui --all-targets -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:qt:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - bash ci/tests/qt-dependencies.test.sh
    - if bash ci/tests/qt-dependencies.test.sh qt,gtk; then echo "FAIL — Qt graph guard accepted GTK"; exit 1; fi
    - if bash ci/tests/qt-dependencies.test.sh ''; then echo "FAIL — Qt graph guard accepted missing display"; exit 1; fi
    - cargo test --locked --no-default-features --features qt --all-targets
    - cargo test --locked --no-default-features --features qt,camera-pipewire --all-targets
    - cargo clippy --locked --no-default-features --features qt,camera-pipewire --all-targets -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:audit:
  extends: [.linux-runner-readonly, .security-audit-job]

security:deny:
  extends: [.linux-runner-readonly, .security-deny-job]

# deny.toml's git sources match the reviewed list in vauchi/scripts
# policy/allowed-git-sources.txt (vauchi/private#1162).
check:allow-git:
  extends: [.allow-git-drift-job]

security:vet:
  extends: [.linux-runner-readonly, .security-vet-job]

# Packages (ADR-078 step 4d.5, owner 2026-11-03): gvauchi replaces the
# vauchi-gtk packages linux-gtk built. A version bump merged to main tags the
# release (auto-tag:version), and the tag pipeline builds these.
package:deb:
  stage: package
  # The official image carries the toolchain rust-toolchain.toml pins
  # (Debian's own rustc is far older). Trixie, not bookworm: the crates need
  # gtk4 >= 4.10 and libadwaita >= 1.4; bookworm has 4.8 and 1.2.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1-trixie
  tags: [docker]
  needs:
    - job: build:gvauchi
      optional: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq devscripts debhelper
        libgtk-4-dev libadwaita-1-dev libqrencode-dev pkg-config
        libasound2-dev libdbus-1-dev libclang-dev libfontconfig1-dev
        libpipewire-0.3-dev
        qt6-base-dev cmake g++ xvfb xauth dbus-daemon
  script:
    # -d: debian/control's Build-Depends name Debian's cargo and rustc,
    # which this image replaces with the pinned toolchain.
    - dpkg-buildpackage -us -uc -b -d
    - mkdir -p deb-out && cp ../*.deb deb-out/
    # gvauchi and qvauchi: one or the other, each starting its own binary.
    - sh ci/tests/packages.test.sh deb-out
  artifacts:
    paths:
      - deb-out/*.deb
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [debian/**/*]
    - when: manual
      allow_failure: true

package:rpm:
  stage: package
  # Fedora 40 is end of life and its rust (1.86) is below what the crates
  # need; Fedora 43's updates carry 1.99.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/fedora:43
  tags: [docker]
  needs:
    - job: build:gvauchi
      optional: true
  before_script:
    - dnf install -y rpm-build cargo rust gtk4-devel libadwaita-devel
        qrencode-devel pkgconfig alsa-lib-devel dbus-devel clang-devel
        fontconfig-devel qt6-qtbase-devel cmake gcc-c++
        pipewire-devel xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon
  script:
    - mkdir -p rpmbuild/{SOURCES,SPECS}
    # The tarball follows Cargo.toml; a spec Version that disagrees fails
    # rpmbuild, which is the check that both moved. gvauchi and qvauchi are
    # two specs: both install app.vauchi.Vauchi.desktop with another Exec.
    - VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
    - |
      for app in gvauchi qvauchi; do
        tar czf "rpmbuild/SOURCES/${app}-${VERSION}.tar.gz" \
          --transform "s,^,${app}-${VERSION}/," --exclude=rpmbuild .
        cp "packaging/${app}.spec" rpmbuild/SPECS/
        rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb "rpmbuild/SPECS/${app}.spec"
      done
    - mkdir -p rpm-out && cp rpmbuild/RPMS/**/*.rpm rpm-out/
  artifacts:
    paths:
      - rpm-out/*.rpm
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [packaging/gvauchi.spec, packaging/qvauchi.spec]
    - when: manual
      allow_failure: true

package:appimage:
  extends: .install-linuxdeploy
  stage: package
  tags: [linux, self-hosted]
  # optional like package:deb/package:rpm: on MRs this job is always
  # present (manual) but build:app only fires on rust/atspi/ci changes,
  # so a hard need made non-code MRs un-creatable ("needs 'build:app'
  # job, but 'build:app' does not exist in the pipeline").
  needs:
    - job: build:gvauchi
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    DEPLOY_GTK_VERSION: "4"
  script:
    # A manual MR run has no tag; it packages the manifest's version.
    - VERSION="${CI_COMMIT_TAG:-}"
    - VERSION="${VERSION#v}"
    - VERSION="${VERSION:-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)}"
    - chmod +x packaging/appimage.sh
    - ./packaging/appimage.sh "$VERSION"
  artifacts:
    paths:
      - "gvauchi-*-x86_64.AppImage"
    expire_in: 1 week

# Preview downloads for the first real-user pilot (vauchi/private#1190): the
# GTK AppImage and the terminal binaries of this assembly, signed keyless with
# the tag pipeline's GitLab identity (owner 2026-11-09; no long-lived key
# leaves core's release jobs). A merge request may run them by hand: they
# sign and verify but upload nothing without a tag.
build:terminal:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: build
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.camera-sdk, before_script]
  script:
    - cargo build --release --locked --no-default-features --features cli,tui
        --bin vauchi --bin vauchi-tui
  artifacts:
    paths:
      - target/release/vauchi
      - target/release/vauchi-tui
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

publish:preview:
  stage: publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  interruptible: false
  needs:
    - job: package:appimage
      artifacts: true
    - job: build:terminal
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_VERSION: "v3.0.5"
    # sigstore/cosign v3.0.5 cosign_checksums.txt; its Windows line matches
    # the windows repo's pin.
    COSIGN_SHA256: "db15cc99e6e4837daabab023742aaddc3841ce57f193d11b7c3e06c8003642b2"
  before_script:
    - apk add --no-cache curl coreutils tar
    - |
      status=$(curl -sL -o /usr/local/bin/cosign -w '%{http_code}' \
        "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64") || status=000
      [ "$status" = 200 ] || { echo "FAIL: cosign download → HTTP $status"; exit 1; }
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
  script:
    - sh ci/publish-preview.sh
  artifacts:
    paths:
      - preview/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

release:preview:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  tags: [docker]
  interruptible: false
  needs:
    - job: publish:preview
  variables:
    PREVIEW_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-linux-preview/${CI_COMMIT_TAG}"
  script:
    - echo "Release ${CI_COMMIT_TAG} links the signed preview downloads"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Linux preview $CI_COMMIT_TAG"
    description: >-
      Preview build for testers: not ready for everyday use. Linux x86_64
      only. Verify a download with
      `cosign verify-blob --bundle FILE.sigstore.json
      --certificate-identity-regexp '^https://gitlab\.com/vauchi/linux-app//\.gitlab-ci\.yml@refs/tags/v'
      --certificate-oidc-issuer https://gitlab.com FILE`.
    assets:
      links:
        - name: "GTK app (AppImage)"
          url: "${PREVIEW_URL}/gvauchi-${CI_COMMIT_TAG}-x86_64.AppImage"
        - name: "Terminal apps (vauchi, vauchi-tui)"
          url: "${PREVIEW_URL}/vauchi-terminal-${CI_COMMIT_TAG}-linux-x86_64.tar.gz"
